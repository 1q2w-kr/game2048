name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prune non-runtime files
        run: |
          set -euxo pipefail
          rm -rf .git .github
          rm -rf scripts script tests test db node_modules
          rm -f README.md README.MD README_KR.md README_KO.md AGENTS.md agents.md SPEC.md TODO.md DOCKER.md docker-compose.yml Dockerfile Makefile test.txt

      - name: Inject build version into asset references
        run: |
          set -euxo pipefail
          VER="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/__BUILD__/${VER}/g" index.php || true

      - name: Resolve deployment target
        id: cfg
        run: |
          set -euxo pipefail
          SERVER="${{ secrets.FTP_SERVER }}"
          USERNAME="${{ secrets.FTP_USERNAME }}"
          PASSWORD="${{ secrets.FTP_PASSWORD }}"
          if [ -z "$SERVER" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Configure FTP_SERVER/FTP_USERNAME/FTP_PASSWORD secrets before deploying." >&2
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SLUG="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          case "$SLUG" in
            pick-a-ju) SLUG="pickaju" ;;
          esac
          DIR="/ciiwol/www/fun/${SLUG}/"
          case "$DIR" in
            */) : ;;
            *) DIR="${DIR%/}/" ;;
          esac
          {
            echo "server=$SERVER"
            echo "username=$USERNAME"
            echo "password=$PASSWORD"
            echo "dir=$DIR"
            echo "port=21"
          } >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to Cafe24 via FTP
        env:
          FTP_SERVER: ${{ steps.cfg.outputs.server }}
          FTP_USERNAME: ${{ steps.cfg.outputs.username }}
          FTP_PASSWORD: ${{ steps.cfg.outputs.password }}
          FTP_PORT: ${{ steps.cfg.outputs.port }}
          FTP_DIR: ${{ steps.cfg.outputs.dir }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow no
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          set xfer:clobber on
          mkdir -p "$FTP_DIR"
          mirror -R . "$FTP_DIR" --verbose=3 --parallel=4 --only-newer --exclude-glob .git* --exclude-glob .DS_Store
          bye
          EOF
