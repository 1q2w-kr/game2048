name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prune non-runtime files
        run: |
          set -euxo pipefail
          rm -rf .git .github
          rm -rf scripts script tests test db node_modules
          rm -f README.md README.MD README_KR.md README_KO.md AGENTS.md agents.md SPEC.md TODO.md DOCKER.md docker-compose.yml Dockerfile Makefile test.txt

      - name: Inject build version into asset references
        run: |
          set -euxo pipefail
          VER="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/__BUILD__/${VER}/g" index.php || true

      - name: Resolve deployment target
        id: cfg
        run: |
          set -euxo pipefail
          SERVER="${{ secrets.FTP_SERVER }}"
          USERNAME="${{ secrets.FTP_USERNAME }}"
          PASSWORD="${{ secrets.FTP_PASSWORD }}"
          if [ -z "$SERVER" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Configure FTP_SERVER/FTP_USERNAME/FTP_PASSWORD secrets before deploying." >&2
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SLUG="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          case "$SLUG" in
            pick-a-ju) SLUG="pickaju" ;;
          esac
          DIR="/www/fun/${SLUG}/"
          case "$DIR" in
            */) : ;;
            *) DIR="${DIR%/}/" ;;
          esac
          {
            echo "server=$SERVER"
            echo "username=$USERNAME"
            echo "password=$PASSWORD"
            echo "dir=$DIR"
            echo "port=21"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cafe24 via FTP
        env:
          FTP_SERVER: ${{ steps.cfg.outputs.server }}
          FTP_USERNAME: ${{ steps.cfg.outputs.username }}
          FTP_PASSWORD: ${{ steps.cfg.outputs.password }}
          FTP_PORT: ${{ steps.cfg.outputs.port }}
          FTP_DIR: ${{ steps.cfg.outputs.dir }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          port = int(os.environ.get('FTP_PORT') or '21')
          target = os.environ['FTP_DIR'].strip()

          skip_dirs = {'.git', '.github', 'scripts', 'script', 'tests', 'test', 'db', 'node_modules'}
          skip_files = {
              '.DS_Store', 'db.local.php', 'config.local.php', 'README.md', 'README.MD',
              'README_KR.md', 'README_KO.md', 'AGENTS.md', 'agents.md', 'SPEC.md',
              'TODO.md', 'DOCKER.md', 'docker-compose.yml', 'Dockerfile', 'Makefile', 'test.txt',
          }
          skip_paths = {'config/local.php'}

          def candidate_paths(path):
              clean = path.strip()
              values = []
              def add(value):
                  value = value.strip()
                  if value and value not in values:
                      values.append(value)
              add(clean)
              add(clean.lstrip('/'))
              if clean.startswith('/www/'):
                  add(clean[len('/www/'):])
                  add('/ciiwol' + clean)
                  add('ciiwol' + clean)
              return values

          def cwd_path(ftp, path):
              if path.startswith('/'):
                  ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  if part:
                      ftp.cwd(part)

          def ensure_remote_dir(ftp, parts):
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          ftp = ftplib.FTP()
          ftp.connect(server, port, timeout=30)
          ftp.login(username, password)
          ftp.set_pasv(True)

          selected = None
          errors = []
          for candidate in candidate_paths(target):
              try:
                  cwd_path(ftp, candidate)
                  selected = ftp.pwd()
                  break
              except Exception as exc:
                  errors.append(f'{candidate}: {exc}')
          if selected is None:
              try:
                  here = ftp.pwd()
                  entries = ', '.join(ftp.nlst()[:20])
              except Exception:
                  here = '(unknown)'
                  entries = '(unavailable)'
              raise SystemExit('No deploy target matched. pwd=' + here + ' entries=' + entries + ' errors=' + ' | '.join(errors))

          root = Path('.').resolve()
          uploaded = 0
          for current, dirs, files in os.walk(root):
              dirs[:] = [d for d in dirs if d not in skip_dirs]
              current_path = Path(current)
              rel = current_path.relative_to(root)
              ftp.cwd(selected)
              if rel.parts:
                  ensure_remote_dir(ftp, rel.parts)
              for name in files:
                  local = current_path / name
                  rel_file = local.relative_to(root).as_posix()
                  if name in skip_files or rel_file in skip_paths:
                      continue
                  with local.open('rb') as handle:
                      ftp.storbinary('STOR ' + name, handle)
                  uploaded += 1
          ftp.quit()
          print(f'Uploaded {uploaded} files to {selected}')
          PY
